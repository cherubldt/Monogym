
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mono Gym</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:25px;

    padding:0px 35px 35px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.6);

}

.logo{

    width:170px;
    height:170px;

    margin:20px auto 0;

    border-radius:50%;

    background:#111;

    border:4px solid #e60012;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.btn i{
    margin-right:12px;
    font-size:22px;
}
h1{

    margin-top:20px;
    font-size:34px;
    color:#ff2b2b;
}

.fa-instagram{
    background:linear-gradient(45deg,#F58529,#FEDA77,#DD2A7B,#8134AF,#515BD4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.fa-facebook-f{
    color:#1877F2;
}

.fa-tiktok{
    color:#000;
    text-shadow:1px 1px #25F4EE,-1px -1px #FE2C55;
}

.fa-whatsapp{
    color:#25D366;
}

.fa-location-dot{
    color:#EA4335;
}

.fa-globe{
    color:#00B4D8;
}

.subtitle{

    margin-top:10px;
    color:#d8d8d8;
    line-height:1.6;

}

.follow{
    margin-top:25px;
    margin-bottom:-10px;

    font-size:18px;
    font-weight:600;

    color:#ffffff;

    letter-spacing:2px;

    text-transform:uppercase;
}
.links{

    margin-top:35px;

}

.btn{

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    width:100%;

    padding:16px;

    margin-bottom:16px;

    border-radius:15px;

    color:white;

    background:#e60012;

    font-size:18px;

    font-weight:600;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-4px);

    background:#ff2b2b;

    box-shadow:0 10px 25px rgba(230,0,18,.4);

}

.footer{

    margin-top:25px;
    font-size:13px;
    color:#9f9f9f;

}
</style>

</head>

<body>

<div class="container">

<div class="logo">

<!-- Replace logo.png with your logo -->
<img src="logo.png" alt="Mono Gym Logo">

</div>

<h1>MONO GYM</h1>

<p class="subtitle">

Where Strength<br>
Becomes a Lifestyle.

</p>

<p class="follow">
    Follow Us on 👇
</p>

<div class="links">

<a class="btn" href="https://instagram.com/shadez.v" target="_blank">
<i class="fa-brands fa-instagram"></i> Instagram
</a>

<a class="btn" href="https://facebook.com/YOURPAGE" target="_blank">
<i class="fa-brands fa-facebook-f"></i>   Facebook
</a>

<a class="btn" href="https://tiktok.com/@YOURUSERNAME" target="_blank">
<i class="fa-brands fa-tiktok"></i>   TikTok
</a>

<a class="btn" href="https://wa.me/213XXXXXXXXX" target="_blank">
<i class="fa-brands fa-whatsapp"></i>   WhatsApp
</a>

<a class="btn" href="https://maps.google.com/" target="_blank">
<i class="fa-solid fa-location-dot"></i>   Location
</a>


</div>

<div class="footer">

© 2026 Mono Gym

</div>

</div>

</body>
</html>
