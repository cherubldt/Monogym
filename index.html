
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mono Gym</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:25px;

    padding:35px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.6);

}

.logo{

    width:120px;
    height:120px;

    margin:120px auto 0;

    border-radius:50%;

    background:#111;

    border:4px solid #e60012;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{

    margin-top:20px;
    font-size:34px;
    color:#ff2b2b;

}

.subtitle{

    margin-top:10px;
    color:#d8d8d8;
    line-height:1.6;

}

.links{

    margin-top:35px;

}

.btn{

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    width:100%;

    padding:16px;

    margin-bottom:16px;

    border-radius:15px;

    color:white;

    background:#e60012;

    font-size:18px;

    font-weight:600;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-4px);

    background:#ff2b2b;

    box-shadow:0 10px 25px rgba(230,0,18,.4);

}

.footer{

    margin-top:25px;
    font-size:13px;
    color:#9f9f9f;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<!-- Replace logo.png with your logo -->
<img src="logo.png" alt="Mono Gym Logo">

</div>

<h1>MONO GYM</h1>

<p class="subtitle">

Train Hard.<br>
Stay Strong.<br>
Become Your Best.

</p>

<div class="links">

<a class="btn" href="https://instagram.com/YOURUSERNAME" target="_blank">
📸 Instagram
</a>

<a class="btn" href="https://facebook.com/YOURPAGE" target="_blank">
👍 Facebook
</a>

<a class="btn" href="https://tiktok.com/@YOURUSERNAME" target="_blank">
🎵 TikTok
</a>

<a class="btn" href="https://wa.me/213XXXXXXXXX" target="_blank">
💬 WhatsApp
</a>

<a class="btn" href="https://maps.google.com/" target="_blank">
📍 Location
</a>

<a class="btn" href="https://YOURWEBSITE.com" target="_blank">
🌐 Website
</a>

</div>

<div class="footer">

© 2026 Mono Gym

</div>

</div>

</body>
</html>
